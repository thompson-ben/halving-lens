name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Offline data-integrity tests for the observed-series join (PR133) —
      # guards against delayed feeds leaking synthetic values as observed.
      - name: Data-join tests
        run: npm run test-observed-join

      # Cost of Production model tests (PR134) — offline verification of the
      # model maths, safe failure modes and classification bands.
      - name: Production-cost model tests
        run: npm run test-production-cost

      # Analytics taxonomy integrity (PR136) — client and server derive from
      # one shared event list; unknown events still 400; one conversion event
      # per signup. Guards against the silent-rejection drift this PR fixed.
      - name: Analytics taxonomy tests
        run: npm run test-analytics-events

      # Observed-archive merge (PR140) — a fresh rolling-window fetch may
      # never shrink a stored series' date range or drop an observed point.
      - name: Observed-archive tests
        run: npm run test-observed-archive

      # ETF-archive merge (V2.1 Phase 0) — the provider's rolling window may
      # never erode committed ETF trading days; cumulative stays a running
      # net total since the first stored observation.
      - name: ETF-archive tests
        run: npm run test-etf-archive

      # Metric content pack (MW2-A) — the dashboard and the social pack can
      # never disagree about whether a metric moved or what may be claimed.
      - name: Metric-cards agreement tests
        run: npm run test-metric-cards

      # Daily Brief ↔ Cycle Dashboard agreement (DBV2-A) — the brief payload
      # quotes canonical intelligence; this suite proves it can never drift.
      - name: Brief-intel agreement tests
        run: npm run test-brief-intel

      # Cycle Dashboard onboarding email (CDOE) — the email quotes canonical
      # dashboard intelligence, and the one-off broadcast cannot send without
      # an explicit confirm flag.
      - name: Dashboard-onboarding tests
        run: npm run test-dashboard-onboarding

      # Conversion truth & continuity (Programme 1) — no acquisition surface
      # may show a retired product, promise something the Daily Brief does not
      # deliver, or route peak intent away from the Cycle Dashboard; and the
      # audit's do-not-change list must survive future edits.
      - name: Conversion-truth tests
        run: npm run test-conversion-truth

      # Acquisition measurement (Founder Gate 1) — unusable spend can never
      # render as a real £0.00 cost, and a conversion rate's numerator and
      # denominator must describe the same eligible landing population.
      - name: Acquisition-metric tests
        run: npm run test-acquisition-metrics

      # Observed-window registry (PR141) — the registry faithfully mirrors
      # the committed snapshot's windows and never exposes synthetic history.
      - name: Observed-window tests
        run: npm run test-observed-windows

      # Four Reference Prices engine (Phase A) — configuration naming,
      # evidence-tiered statistics, and the deterministic interpretation
      # (no banned vocabulary, never a forecast, always the standing close).
      - name: Reference-framework tests
        run: npm run test-reference-framework

      # Growth-opportunity engine — flagship registry completeness, dynamic
      # recommendation copy, journey-aware lifecycle states, and the
      # unchanged impact model.
      - name: Growth-opportunity tests
        run: npm run test-growth-opportunities

      # /free ad-congruent headlines — allowlist-only resolution, house
      # register (no banned vocabulary, hype or urgency), single-sourced copy.
      - name: Free-headline tests
        run: npm run test-free-headlines

      # Admin Pro-waitlist demand count — canonical semantics pinned: the
      # pro_waitlist table is the only counting authority (never analytics
      # events), incomplete reads void the secondary stat, no PII on page.
      - name: Pro-waitlist count tests
        run: npm run test-pro-waitlist-count

      # Card caption link (B-1) — the canonical share-attribution convention
      # (source=social, medium=card, card_<metricId>_p<period>_<yyyymmdd>,
      # /cycle-dashboard destination) and the refusal rule for malformed
      # card identity. Founder tool only: no event, no consumer change.
      - name: Card-caption tests
        run: npm run test-card-caption

      # Start Here narrative — seven-chapter structure, approved hero, the
      # bridge ladder (configuration → framework → signup), register and
      # integration (journey map, nav, sitemap, analytics labels).
      - name: Start-here tests
        run: npm run test-start-here

      # Founder Intelligence dashboard — trend-first windows on the spine's
      # comparison substrate, deterministic verdicts with volume floors,
      # traffic classification, and the product-release registry.
      - name: Founder-trends tests
        run: npm run test-founder-trends

      # Permanent daily-close price archive (Seasonality PR-A) — merge
      # idempotence and retention, UTC daily uniqueness, exact month-boundary
      # methodology, and real-archive completeness once populated.
      - name: Price-archive tests
        run: npm run test-price-archive

      # Seasonality engine (PR-B) — cell generation, returns + valuation
      # modes, month statistics, current-month context, filter membership,
      # insight floors and ties, and honest observed-window enforcement.
      - name: Seasonality tests
        run: npm run test-seasonality

      # Seasonality page layer (PR-C) — payload/engine equality, client-safe
      # core split, mode-specific user language, framework-language tooltips,
      # and every ecosystem integration point.
      - name: Seasonality-page tests
        run: npm run test-seasonality-page

      # Cycle-aligned seasonality engine (PR-V2A) — anchored-month boundary
      # methodology, stub/running-month partials, observed grid horizon,
      # zero-neutral agreement classification on unrounded values,
      # completed-cycles-only language, per-cycle reference coverage, and
      # the banned-language scan over emitted text.
      - name: Cycle-seasonality tests
        run: npm run test-cycle-seasonality

      # Cycle-aligned seasonality page (PR-V2B) — payload/engine equality,
      # the five distinct cell states, grid-only navigation, shared
      # highlight/dialog contracts, honest language, integrations.
      - name: Cycle-seasonality page tests
        run: npm run test-cycle-seasonality-page

      # Bitcoin Questions (PR-Q1) — registry contract, vocabulary rules,
      # evidence-token discipline, EngineSentence state fixtures, static-claim
      # drift recomputation, the staleness contract, structured-data and
      # editorial-date rules, and ecosystem integration.
      - name: Questions tests
        run: npm run test-questions

      # Market Movers significance & rarity engine (SoB 2.0, PR-SB1) —
      # movement definitions per unit/kind, equivalent-period distributions,
      # observation floors, crossing uplift, honest windows (no modelled
      # backfill), and the causal/predictive language scan.
      - name: Market-movers tests
        run: npm run test-market-movers

      # This Week in Five (SoB 2.0, PR-SB3) — tier hierarchy, diversity
      # invariant, deep-link spread, quiet-week fallback and language scan.
      - name: Talking-points tests
        run: npm run test-talking-points

      # Weekly Briefing model (SoB 2.0, PR-SB4) — one canonical verdict opened
      # and closed on, the five-question front page mapped to the five acts,
      # the documentary bridges, presentation-free model discipline, and the
      # house-vocabulary scan.
      - name: Weekly-briefing tests
        run: npm run test-weekly-briefing

      # Presenter Mode 2.0 (SoB 2.0, PR-SB5) — the episode script as a pure
      # projection of the briefing model, model-owned spoken bridges, the
      # data-free running order, the props-only HUD, and the language scan.
      - name: Presenter tests
        run: npm run test-presenter

      # Editorial design system (SB6a) — the named type scale as the only
      # text sizing in the SoB tree, the editorial colour as a single-source
      # token, one eyebrow style, colour roles, and the reading measure.
      - name: Editorial-system tests
        run: npm run test-editorial-system

      # Reference-gap engine (PR-FRP1) — gap-series construction without
      # interpolation, cadence gates, the explicit mining-cost 24h omission,
      # trajectory phrasing, rarity floors and the language scan.
      - name: Reference-gap tests
        run: npm run test-reference-gaps

      # Cycle-day authority (Cycle Dashboard V2, CD0) — the day established
      # from first principles (archive last date − current halving), every
      # production consumer resolving to it, clock-free source discipline,
      # the scorecard's stable methodology identifier, the single canonical
      # score→band mapping, and the quarantined-composite import scan.
      - name: Cycle-day authority tests
        run: npm run test-cycle-day

      # Cycle-lens engine (Cycle Dashboard V2, CD1) — daily halving-aligned
      # series with no interpolation, explicit unreached/unavailable states,
      # forward-window honesty, the single shared Mayer methodology,
      # parameterised equivalent-day engines with bit-identical defaults,
      # editorial thresholds (no percentile idiom over three prior cycles)
      # and the language scans.
      - name: Cycle-lens tests
        run: npm run test-cycle-lens

      # Cycle Dashboard (Cycle Dashboard V2, CD2) — the Lens client payload
      # as a faithful engine projection (unavailable states preserved, no
      # recomputation downstream), renderer/page contracts, the accessible
      # range control, /replay retirement + routing, the honest Pro
      # early-access seam, and the language scan.
      - name: Cycle-dashboard tests
        run: npm run test-cycle-dashboard

      # Metric Watch engine (Cycle Dashboard V2, MW1) — the shared lifecycle
      # vocabulary (Cycle Lens bit-identical), exact contiguous-state runs,
      # the measured anti-churn transition gate, the state registry that
      # references (never re-declares) thresholds, evidence floors, stable
      # event identities, quiet-day honesty and the forecast-language scans.
      - name: Metric-watch tests
        run: npm run test-metric-watch

      - name: Dashboard-intel tests
        run: npm run test-dashboard-intel

      # Subscription decision contract — success/conversion only on confirmed
      # durable capture; canonical `signup` is the single conversion event.
      - name: Subscription contract tests
        run: npm run test-subscribe

      # Build against whatever snapshot is checked in — does not hit the
      # network. Vercel runs `npm run sync` separately on deploy.
      - name: Build
        run: npm run build

      # Heading-outline regression check (PR132): one h1 per public page, no
      # level jumps, skip link present. Runs against the production build; the
      # script retries until the server responds and the server is killed after.
      - name: Heading checks
        run: |
          npm start &
          SERVER_PID=$!
          node scripts/check-headings.mjs
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS
