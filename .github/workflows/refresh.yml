name: Intraday refresh

# Lightweight price/sentiment refresh every 6 hours, in addition to the daily
# 08:00 Europe/London full sync. This run re-fetches only the keyless, generous
# sources (CoinMetrics price + market/realised cap + supply, alternative.me Fear
# & Greed, mempool.space hashrate). It deliberately does NOT set FULL_SYNC or the
# on-chain / ETF API keys, so the rate-limited BGeometrics on-chain metrics and
# SoSoValue ETF flows are carried over from the last full sync — zero calls to
# the limited APIs. Commits the snapshot so the live site, brief headline and
# "what changed" update; the brief archive + warehouse are written by the daily
# full sync only.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # every 6 hours (UTC)
  workflow_dispatch:

# Shared with the daily full sync so the two never run / push concurrently.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Light price + sentiment refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Light sync (on-chain + ETF carried over)
        run: npm run sync
        # No FULL_SYNC and no BITCOIN_DATA_API_KEY / SOSOVALUE_API_KEY on purpose:
        # the on-chain metrics and ETF flows carry over from the committed
        # snapshot, so the rate-limited sources are never called here.

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet src/lib/data/snapshot.ts; then
            echo "No change — price/sentiment already current."
            exit 0
          fi
          git config user.name "halving-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data/snapshot.ts
          git commit -m "chore(data): intraday refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
