name: Daily sync

# Refreshes the live Bitcoin data snapshot once a day at 08:00 Europe/London and
# commits the change. Vercel auto-deploys on push, so the production site —
# the daily brief, content-pack cards and warehouse — refreshes each morning.
#
# GitHub cron is UTC-only and doesn't follow British Summer Time, so we schedule
# at both 07:00 and 08:00 UTC and a gate job only lets the run proceed when it's
# actually 08:00 in London (07:00 UTC in BST, 08:00 UTC in GMT) — exactly one run
# per day at 8am London. Manual runs from the Actions tab always proceed.

on:
  schedule:
    - cron: "0 7 * * *" # 08:00 London during BST (summer)
    - cron: "0 8 * * *" # 08:00 London during GMT (winter)
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Only at 08:00 Europe/London
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          H=$(TZ=Europe/London date +%H)
          echo "London hour: $H"
          if [ "$H" = "08" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  sync:
    name: Pull live snapshot
    needs: gate
    # Proceed only at 8am London (scheduled) or whenever triggered manually.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync live data
        run: npm run sync
        env:
          # Full sync fetches the rate-limited on-chain source (once per day here,
          # not on every Vercel deploy).
          FULL_SYNC: "1"
          # Optional — enables US spot BTC ETF flows (SoSoValue) when set.
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
          # Optional — enables on-chain metrics (BGeometrics / bitcoin-data.com).
          BITCOIN_DATA_API_KEY: ${{ secrets.BITCOIN_DATA_API_KEY }}

      - name: Persist today's brief into the archive
        run: npm run persist-brief

      - name: Persist today's edition into the Morning Research Library
        run: npm run persist-edition

      - name: Persist this week's HalvingLens Weekly Research
        run: npm run persist-weekly

      - name: Append today's intelligence to the historical warehouse
        # Permanently stores the day's metrics, scores, signals, narratives,
        # brief, content and state changes in Supabase. Non-fatal — skips quietly
        # if the Supabase secrets aren't set. Run supabase/warehouse.sql once.
        run: npm run warehouse
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Deploy BEFORE sending, then warm the hero image, so email image proxies
      # never fetch it cold. Previously the send ran first (against the previous
      # deployment) and the image proxy's first request cold-rendered and timed
      # out → broken hero image.
      - name: Commit snapshot + brief archive (deploy today's build first)
        run: |
          if git diff --quiet src/lib/data/snapshot.ts src/lib/data/briefs.ts src/lib/data/editions.ts src/lib/data/weeklies.ts; then
            echo "No data changes — nothing to deploy; will warm the existing deployment."
          else
            git config user.name "halving-lens-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/lib/data/snapshot.ts src/lib/data/briefs.ts src/lib/data/editions.ts src/lib/data/weeklies.ts
            git commit -m "chore(data): refresh snapshot + brief ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Wait for deploy, then warm the daily hero image
        # The emails embed /email/chart/<today>. Give Vercel time to publish the
        # push above, then request that URL until it returns a real image — this
        # renders + caches it in Vercel's durable cache, so Apple/Gmail's proxy
        # gets a warm hit instead of a cold render. Non-fatal.
        continue-on-error: true
        run: |
          BASE="${NEXT_PUBLIC_SITE_URL:-https://halvinglens.com}"
          URL="${BASE%/}/email/chart/$(date -u +%Y-%m-%d)"
          echo "Warming $URL"
          sleep 120
          for i in $(seq 1 15); do
            OUT=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" -A "halvinglens-warmer" "$URL" || echo "000 -")
            echo "warm attempt $i → $OUT"
            case "$OUT" in "200 image/"*) echo "hero image warm ✓"; break;; esac
            sleep 20
          done
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Send the daily brief email
        # Sends the day's brief to active subscribers via Resend, then logs each
        # send + a daily summary to Supabase. Idempotent per day (won't double-
        # send). Non-fatal and skips quietly if RESEND_API_KEY / Supabase aren't
        # set. Run supabase/email.sql once. Requires a verified Resend domain.
        run: npm run send-email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Send the Day-2 onboarding showcase email
        # One-time per subscriber, ~a day after they join. Idempotent
        # (showcase_sent_at) and safe to run daily. Non-fatal; skips quietly if
        # the column/secrets aren't set. Run supabase/email.sql once.
        run: npm run send-showcase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Send the weekly research email (Sundays)
        # Idempotent per ISO week and gated to Sunday — safe to run daily.
        run: npm run send-weekly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Send the founder weekly intelligence report (Mondays, founder only)
        # Monday-gated + idempotent per ISO week — safe to run daily. Goes only
        # to FOUNDER_EMAIL, never to subscribers.
        run: npm run send-founder-report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          FOUNDER_EMAIL: ${{ secrets.FOUNDER_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
