name: Daily sync

# Refreshes the live Bitcoin data snapshot once a day at 08:00 Europe/London and
# commits the change. Vercel auto-deploys on push, so the production site —
# the daily brief, content-pack cards and warehouse — refreshes each morning.
#
# GitHub cron is UTC-only and doesn't follow British Summer Time, so we schedule
# at both 07:00 and 08:00 UTC and an in-job gate step only lets the run proceed
# when it's actually 08:00 in London (07:00 UTC in BST, 08:00 UTC in GMT) —
# exactly one run per day at 8am London. Manual runs always proceed.
#
# The gate is a STEP inside the single job (not a separate job) on purpose: a
# separate gate job needs its own runner, and if that runner can't be acquired
# the whole pipeline is skipped with no data refresh and no brief sent (this
# happened on 2026-07-09). Keeping everything in one job means one runner
# acquisition, and `timeout-minutes` guarantees a stuck run fails fast (and
# visibly) instead of hanging for minutes and then being cancelled silently.

on:
  schedule:
    - cron: "0 7 * * *" # 08:00 London during BST (summer)
    - cron: "0 8 * * *" # 08:00 London during GMT (winter)
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Pull live snapshot
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck runner/queue can never hang for many minutes and
    # then get cancelled silently — it fails fast and surfaces a clear failure.
    # Allows for the image-warm poll + the founder-preview hold window below.
    timeout-minutes: 30
    steps:
      # Gate — decide whether this run should do the real work. Manual runs
      # (workflow_dispatch) always proceed; scheduled runs proceed only at 08:00
      # Europe/London. Every real step below is guarded on `steps.gate.outputs.run`,
      # so an out-of-window scheduled run is a clean no-op success.
      - name: Gate (only at 08:00 Europe/London; manual runs always proceed)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            H=$(TZ=Europe/London date +%H)
            echo "London hour: $H"
            if [ "$H" = "08" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Not the window — nothing to do
        if: steps.gate.outputs.run != 'true'
        run: echo "Not 08:00 Europe/London and not a manual run — skipping the daily sync."

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Sync live data
        if: steps.gate.outputs.run == 'true'
        run: npm run sync
        env:
          # Full sync fetches the rate-limited on-chain source (once per day here,
          # not on every Vercel deploy).
          FULL_SYNC: "1"
          # Optional — enables US spot BTC ETF flows (SoSoValue) when set.
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
          # Optional — enables on-chain metrics (BGeometrics / bitcoin-data.com).
          BITCOIN_DATA_API_KEY: ${{ secrets.BITCOIN_DATA_API_KEY }}

      - name: Persist today's brief into the archive
        if: steps.gate.outputs.run == 'true'
        run: npm run persist-brief

      - name: Persist today's edition into the Morning Research Library
        if: steps.gate.outputs.run == 'true'
        run: npm run persist-edition

      - name: Persist this week's HalvingLens Weekly Research
        if: steps.gate.outputs.run == 'true'
        run: npm run persist-weekly

      - name: Append today's intelligence to the historical warehouse
        # Permanently stores the day's metrics, scores, signals, narratives,
        # brief, content and state changes in Supabase. Non-fatal — skips quietly
        # if the Supabase secrets aren't set. Run supabase/warehouse.sql once.
        if: steps.gate.outputs.run == 'true'
        run: npm run warehouse
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Deploy BEFORE sending, then warm the hero image, so email image proxies
      # never fetch it cold. Previously the send ran first (against the previous
      # deployment) and the image proxy's first request cold-rendered and timed
      # out → broken hero image.
      - name: Commit snapshot + brief archive (deploy today's build first)
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet src/lib/data/snapshot.ts src/lib/data/priceArchiveData.ts src/lib/data/briefs.ts src/lib/data/editions.ts src/lib/data/weeklies.ts; then
            echo "No data changes — nothing to deploy; will warm the existing deployment."
          else
            git config user.name "halving-lens-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/lib/data/snapshot.ts src/lib/data/priceArchiveData.ts src/lib/data/briefs.ts src/lib/data/editions.ts src/lib/data/weeklies.ts
            git commit -m "chore(data): refresh snapshot + brief ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Verify + warm the daily hero image
        # The email embeds /email/chart/<today> on the CANONICAL host (the app
        # resolves any redirect at send time — see resolveEmailImageBase). We warm
        # that final asset by FOLLOWING redirects (-L) and requiring a real
        # `200 image/*`; the -w code is the FINAL response, i.e. exactly what the
        # email's image resolves to. If even the canonical host can't serve it, we
        # fail loudly with a diagnostic instead of shipping a broken image silently
        # (the 2026-07-09 incident was a redirect hidden by continue-on-error).
        # `!cancelled()` so it still runs after an upstream failure; the long poll
        # gives the fresh Vercel deploy time to go live.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: |
          BASE="${NEXT_PUBLIC_SITE_URL:-https://halvinglens.com}"
          URL="${BASE%/}/email/chart/$(date -u +%Y-%m-%d)"
          echo "Warming (following redirects to the canonical host): $URL"
          sleep 90
          OUT="000 -"
          for i in $(seq 1 24); do
            OUT=$(curl -sL -o /dev/null -w "%{http_code} %{content_type}" -A "halvinglens-warmer" "$URL" || echo "000 -")
            echo "attempt $i → $OUT"
            case "$OUT" in "200 image/"*) echo "hero image warm ✓"; exit 0;; esac
            sleep 20
          done
          echo "::error title=Hero image not servable::$URL never resolved to a '200 image/*' (last: $OUT). Recipients may see a broken image. Check that halvinglens.com serves /email/chart/<date> as an image. The brief still sends (decoupled)."
          exit 1
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Preview the brief to the founder (before subscribers)
        # Sends the fully-rendered brief to the founder only — no subscriber list,
        # no delivery record, no once-per-day guard — so it can be eyeballed ahead
        # of the real send. The hold below is the window to cancel this run if the
        # preview looks wrong. Decoupled so it still runs after an upstream failure.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: npm run send-email
        env:
          BRIEF_TEST_TO: ${{ secrets.FOUNDER_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Hold for the founder review window
        # Time between the founder preview and the subscriber send. Cancel this run
        # during the hold to abort the subscriber send. Override the lead time with
        # a BRIEF_PREVIEW_LEAD_MINUTES repo variable (default 10 minutes).
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: |
          MIN="${BRIEF_PREVIEW_LEAD_MINUTES:-10}"
          echo "Founder preview sent — holding ${MIN} min before the subscriber send (cancel this run to abort)."
          sleep $(( MIN * 60 ))
        env:
          BRIEF_PREVIEW_LEAD_MINUTES: ${{ vars.BRIEF_PREVIEW_LEAD_MINUTES }}

      - name: Send the daily brief email
        # Sends the day's brief to active subscribers via Resend, then logs each
        # send + a daily summary to Supabase. Idempotent per day (won't double-
        # send). Non-fatal and skips quietly if RESEND_API_KEY / Supabase aren't
        # set. Run supabase/email.sql once. Requires a verified Resend domain.
        # Decoupled from the data pipeline: `!cancelled()` lets the send run even
        # if an upstream data step failed, so a refresh hiccup can never block the
        # brief — it goes out with the last-good committed snapshot. The run still
        # shows red if something upstream broke, so failures stay visible.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: npm run send-email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Send onboarding lifecycle emails
        # Config-driven onboarding sequence. Drips one email per subscriber per
        # run, idempotent per step (lifecycle_sends), back-enrols existing
        # subscribers, never touches the Daily Brief. Non-fatal; skips quietly if
        # secrets aren't set. Run supabase/lifecycle.sql once.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: npm run send-lifecycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Onboarding sequence config (optional). LIFECYCLE_YOUTUBE_URL makes the
          # day-4 email link the real channel; LIFECYCLE_LAUNCH sets the
          # back-enrolment date for existing subscribers.
          LIFECYCLE_YOUTUBE_URL: ${{ secrets.LIFECYCLE_YOUTUBE_URL }}
          LIFECYCLE_LAUNCH: ${{ secrets.LIFECYCLE_LAUNCH }}

      - name: Send the weekly research email (Sundays)
        # Idempotent per ISO week and gated to Sunday — safe to run daily.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: npm run send-weekly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Send the Weekly Round-up email (Sundays)
        # Personalised retention round-up. Sunday-gated + idempotent per ISO week
        # — safe to run daily. Non-fatal.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: npm run send-roundup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          LIFECYCLE_YOUTUBE_URL: ${{ secrets.LIFECYCLE_YOUTUBE_URL }}

      - name: Send the founder weekly intelligence report (Mondays, founder only)
        # Monday-gated + idempotent per ISO week — safe to run daily. Goes only
        # to FOUNDER_EMAIL, never to subscribers.
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: npm run send-founder-report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          FOUNDER_EMAIL: ${{ secrets.FOUNDER_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
