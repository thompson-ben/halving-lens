name: Daily sync

# Refreshes the live Bitcoin data snapshot once a day at 02:15 UTC and
# commits the change. Vercel auto-deploys on push, so the production site
# stays current without manual intervention.
#
# Can also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Pull live snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync live data
        run: npm run sync

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet src/lib/data/snapshot.ts; then
            echo "No changes — snapshot is already up to date."
            exit 0
          fi
          git config user.name "halving-lens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data/snapshot.ts
          git commit -m "chore(data): refresh snapshot ($(date -u +%Y-%m-%d))"
          git push
